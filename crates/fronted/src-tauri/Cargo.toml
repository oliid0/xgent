[package]
name = "xgent"
# Release builds override this dev placeholder from the Git tag workflow.
version = "0.0.0-dev"
description = "Xgent desktop application"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "xgent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1.0.150"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["image-png"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-browser-automation = { path = "../../browser-automation" }
tauri-plugin-mobile-assistant = { path = "../../mobile-assistant" }
tauri-plugin-mobile-execution = { path = "../../mobile-execution" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
reqwest = { version = "0.13.4", features = ["blocking", "json", "stream", "socks"] }
percent-encoding = "2.3.2"
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.52.3", features = ["fs", "macros", "net", "sync", "time", "io-util"] }
tokio-stream = "0.1.18"
futures-util = "0.3.32"
uuid = { version = "1.23.4", features = ["v4"] }
base64 = "0.22.1"
globset = "0.4.18"
lopdf = "0.43.0"
regex = "1.12.4"
thiserror = "2.0.18"
walkdir = "2.5.0"
dirs = "6.0.0"
toml = "0.9.11"
ignore = "0.4.27"
rusqlite = { version = "0.40.1", features = ["bundled"] }
chrono = "0.4.45"
tokio-cron-scheduler = "0.15.1"
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
tauri-plugin-stronghold = "2.3.1"
quick-xml = "0.41.0"
encoding_rs = "0.8.35"
chardetng = "0.1.17"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "unstable"] }
if-addrs = "0.14.0"
leveldb-core = "0.1.0"
notify = "8.2.0"
rfd = "0.17.2"
tauri-plugin-mcp-bridge = "0.12.0"
tauri-plugin-updater = "2.10.1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-window-state = "2.4.1"
semver = "1.0.28"
portable-pty = "0.9.0"
wait-timeout = "0.2.1"
russh = "0.62.2"
russh-sftp = "2.3.0"
rquickjs = { version = "0.8", features = ["array-buffer", "classes", "bindgen"] }
urlencoding = "2.1.3"
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
hmac = "0.12.1"
sha1 = "0.10.6"
flate2 = "1.1.8"
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSControl", "NSView", "NSWindow"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2 = { version = "0.6", default-features = false, features = ["std"] }
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
tauri = { version = "2.11.5", features = ["test"] }
