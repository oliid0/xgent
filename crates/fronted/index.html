<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>XGent</title>
    <script>
      try {
        if (localStorage.getItem("xgent.launch-completed.v1") === "true") {
          document.documentElement.dataset.initialized = "true";
        }
      } catch {}
    </script>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; background: #fcfcfc; color: #202124; }
      #initial-setup { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 16px; background: inherit; font-family: system-ui, sans-serif; }
      html[data-initialized="true"] #initial-setup { display: none; }
      #launch-error { position: fixed; inset: 0; margin: auto; width: min(80vw, 420px); height: fit-content; text-align: center; font-family: system-ui, sans-serif; }
      @media (prefers-color-scheme: dark) {
        body { background: #18191b; color: #f4f4f5; }
      }
    </style>
  </head>
  <body>
    <div id="root" inert></div>
    <div id="initial-setup" role="status" aria-label="首次初始化">
      <img src="/favicon.svg" alt="" width="64" height="64" />
      <span>正在初始化 XGent…</span>
    </div>
    <p id="launch-error" role="alert" hidden>加载失败，请重新打开应用。<a href="">重新加载</a></p>
    <script>
      function revealLaunchError() {
        document.getElementById("initial-setup")?.remove();
        const message = document.getElementById("launch-error");
        if (message) message.hidden = false;
      }
      window.addEventListener("error", revealLaunchError, true);
      window.addEventListener("unhandledrejection", revealLaunchError);
      window.setTimeout(revealLaunchError, 20000);
    </script>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
