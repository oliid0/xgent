"$schema" = "schemas/schema.json"

[[permission]]
identifier = "allow-native-event-listeners"
description = "Allows the native output/install-progress listener lifecycle used by Xgent's mobile Shell."
# Tauri's JS API uses snake_case and falls back to registerListener; the pinned
# native Plugin implementations expose camelCase methods on Android and iOS.
commands.allow = ["register_listener", "registerListener", "remove_listener", "removeListener"]
