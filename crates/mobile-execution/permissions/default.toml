"$schema" = "schemas/schema.json"

[default]
description = "Allows Xgent's bundled mobile execution environment to be inspected, installed, run, and cancelled."
permissions = [
  "allow-status",
  "allow-install",
  "allow-install-toolchains",
  "allow-list-external-workspaces",
  "allow-pick-external-workspace",
  "allow-remove-external-workspace",
  "allow-run",
  "allow-cancel",
]
