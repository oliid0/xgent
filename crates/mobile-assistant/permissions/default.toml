"$schema" = "schemas/schema.json"

[default]
description = "Allows the Xgent mobile shell to inspect native assistant capabilities and start user-initiated voice input."
permissions = [
  "allow-scan-bluetooth",
  "allow-read-clipboard",
  "allow-write-clipboard",
  "allow-open-settings",
  "allow-get-current-location",
  "allow-read-health-steps",
  "allow-request-health-metric-permission",
  "allow-read-health-samples",
  "allow-status",
  "allow-start-voice-input",
  "allow-check-permissions",
  "allow-request-permissions",
  "allow-list-calendar-events",
  "allow-list-reminders",
  "allow-create-calendar-event",
  "allow-create-reminder",
  "allow-compose-message",
]
