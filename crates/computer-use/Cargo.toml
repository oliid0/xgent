[package]
name = "xgent-computer-use"
version = "0.1.0"
edition = "2021"
description = "Xgent built-in native computer use"
license = "MIT"

[lib]
crate-type = ["rlib"]

[dependencies]
serde_json = "1.0.150"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
base64 = "0.22.1"
enigo = { version = "=0.6.1", features = ["wayland", "libei_smol"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
xcap = "=0.9.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13.2"
zbus = { version = "5.17.0", features = ["blocking-api"] }
