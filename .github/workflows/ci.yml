name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.19.0

jobs:
  workflows:
    name: Workflow Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache: false

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate GitHub Actions workflows
        run: actionlint

  frontend:
    name: Unified Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10.32.1

      - name: Install dependencies
        working-directory: crates/fronted
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build Web frontend
        working-directory: crates/fronted
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/frontend-build.log"
          if ! pnpm build:web 2>&1 | tee "$log"; then
            message="$(tail -n 160 "$log")"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error file=crates/fronted/package.json,line=1,title=Frontend build failed::$message"
            exit 1
          fi

      - name: Lint unified frontend
        id: frontend_lint
        continue-on-error: true
        working-directory: crates/fronted
        run: pnpm lint

      - name: Generate frontend lint fix patch
        if: steps.frontend_lint.outcome == 'failure'
        working-directory: crates/fronted
        run: |
          pnpm lint:fix
          git diff --binary -- src > ../../frontend-lint-fix.patch

      - name: Upload frontend lint fix patch
        if: steps.frontend_lint.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-lint-fix-patch
          path: frontend-lint-fix.patch
          if-no-files-found: error
          retention-days: 1

      - name: Persist frontend lint fixes on main
        if: steps.frontend_lint.outcome == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/fronted/src
          if ! git diff --cached --quiet; then
            git commit -m "style: apply frontend lint fixes"
            git push
          fi

      - name: Verify generated frontend lint fixes
        id: frontend_lint_verify
        if: steps.frontend_lint.outcome == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        working-directory: crates/fronted
        run: pnpm lint

      - name: Test frontend modules
        id: frontend_tests
        continue-on-error: true
        working-directory: crates/fronted
        run: pnpm test:frontend

      - name: Test release scripts
        working-directory: crates/fronted
        run: pnpm test:release

      - name: Enforce frontend validation result
        if: >-
          steps.frontend_tests.outcome == 'failure' ||
          (steps.frontend_lint.outcome == 'failure' &&
          (github.event_name != 'push' || github.ref != 'refs/heads/main' ||
          steps.frontend_lint_verify.outcome != 'success'))
        run: exit 1

  tauri-rust:
    name: Tauri Rust Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/fronted/src-tauri

      - name: Check Tauri backend tests
        env:
          CARGO_TERM_COLOR: always
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/tauri-check.log"
          if ! cargo check --manifest-path crates/fronted/src-tauri/Cargo.toml --tests 2>&1 | tee "$log"; then
            message="$(tail -n 200 "$log")"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error file=crates/fronted/src-tauri/Cargo.toml,line=1,title=Tauri Rust check failed::$message"
            exit 1
          fi

      # Local toolchains are intentionally not required for this repository.
      # Upload Cargo's resolved lockfile so dependency changes discovered by
      # the Linux runner can be reviewed and committed from the Actions result.
      - name: Upload resolved Cargo lockfile
        if: ${{ always() && hashFiles('Cargo.lock') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: resolved-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1

      - name: Persist resolved Cargo lockfile on main
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh Cargo lockfile"
            git push
          fi

      - name: Test Tauri history migrations
        env:
          CARGO_TERM_COLOR: always
        run: cargo test --manifest-path crates/fronted/src-tauri/Cargo.toml chat_history --lib

  architecture:
    name: Architecture Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check single-frontend boundaries
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/architecture.log"
          if ! node scripts/check-architecture.mjs 2>&1 | tee "$log"; then
            message="$(tail -n 120 "$log")"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error file=scripts/check-architecture.mjs,line=1,title=Architecture guard failed::$message"
            exit 1
          fi

  whitespace:
    name: Diff Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: git diff --check
