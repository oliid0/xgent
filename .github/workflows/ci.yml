name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.19.0

jobs:
  workflows:
    name: Workflow Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.12
          cache: false

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate GitHub Actions workflows
        run: actionlint

  frontend:
    name: Unified Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        shell: bash
        run: npm install -g "$(node -p "require('./crates/fronted/package.json').packageManager")"

      - name: Install dependencies
        working-directory: crates/fronted
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck and build Web frontend
        working-directory: crates/fronted
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/frontend-build.log"
          if ! pnpm build:web 2>&1 | tee "$log"; then
            message="$(tail -n 160 "$log")"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error file=crates/fronted/package.json,line=1,title=Frontend build failed::$message"
            exit 1
          fi

      - name: Lint unified frontend
        working-directory: crates/fronted
        run: pnpm lint

      - name: Test frontend modules
        timeout-minutes: 10
        working-directory: crates/fronted
        env:
          XGENT_REQUIRE_BROWSER_TESTS: "true"
        run: pnpm test:frontend

      - name: Test release scripts
        working-directory: crates/fronted
        run: pnpm test:release

      - name: Upload frontend for rendered verification
        uses: actions/upload-artifact@v7
        with:
          name: frontend-preview
          path: crates/fronted/dist
          retention-days: 1
          if-no-files-found: error

  tauri-rust:
    name: Tauri Rust Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri Linux dependencies
        run: |
          # The Azure mirror transferred WebKit slowly in run 230 and
          # exhausted this job before Cargo started. Keep archive failover,
          # but prefer the runner's official HTTPS archive.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:3\n' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev libgbm-dev libxcb1-dev libxkbcommon-dev \
            libclang-dev libxrandr-dev libdbus-1-dev libwayland-dev libegl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/fronted/src-tauri

      - name: Check Tauri backend tests
        env:
          CARGO_TERM_COLOR: always
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/tauri-check.log"
          if ! cargo check --manifest-path crates/fronted/src-tauri/Cargo.toml --tests 2>&1 | tee "$log"; then
            message="$(tail -n 200 "$log")"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error file=crates/fronted/src-tauri/Cargo.toml,line=1,title=Tauri Rust check failed::$message"
            exit 1
          fi

      # Local toolchains are intentionally not required for this repository.
      # Upload Cargo's resolved lockfile so dependency changes discovered by
      # the Linux runner can be reviewed and committed from the Actions result.
      - name: Upload resolved Cargo lockfile
        if: ${{ always() && hashFiles('Cargo.lock') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: resolved-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1

      - name: Test Tauri history migrations
        env:
          CARGO_TERM_COLOR: always
        run: cargo test --manifest-path crates/fronted/src-tauri/Cargo.toml chat_history --lib

      - name: Test mobile status native bridge serialization
        env:
          CARGO_TERM_COLOR: always
        run: cargo test --manifest-path crates/fronted/src-tauri/Cargo.toml -p tauri-plugin-mobile-execution status_preserves_environment_root --lib

  architecture:
    name: Architecture Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check single-frontend boundaries
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/architecture.log"
          if ! node scripts/check-architecture.mjs 2>&1 | tee "$log"; then
            message="$(tail -n 120 "$log")"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error file=scripts/check-architecture.mjs,line=1,title=Architecture guard failed::$message"
            exit 1
          fi

  whitespace:
    name: Diff Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: git diff --check

  native-ui:
    name: Swift packages and native rendering (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, ios, device]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: crates/fronted/src-tauri/native/apple-ui
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Compile the macOS computer permission bridge through the production command
        if: ${{ matrix.platform == 'macos' }}
        run: |
          set -o pipefail
          xcrun swiftc -swift-version 5 -O -emit-library -static -module-name XgentComputerUse \
            -target arm64-apple-macosx15.0 -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            ../computer-use/macos/*.swift -o "$RUNNER_TEMP/libXgentComputerUse.a" \
            2>&1 | tee "$RUNNER_TEMP/native-computer-use.log"
          xcrun nm -g "$RUNNER_TEMP/libXgentComputerUse.a" > "$RUNNER_TEMP/native-computer-use-symbols.txt"
          grep -Eq ' [Tt] _xgent_cua_permissions$' "$RUNNER_TEMP/native-computer-use-symbols.txt"
          grep -E ' [Tt] _xgent_cua_permissions$' "$RUNNER_TEMP/native-computer-use-symbols.txt" \
            | tee "$RUNNER_TEMP/native-computer-use-exports.log"

      - name: Test macOS package
        if: ${{ !cancelled() && matrix.platform == 'macos' }}
        run: |
          set -o pipefail
          xcodebuild test -scheme XgentNativeUI -destination 'platform=macOS' -skipPackagePluginValidation \
            -resultBundlePath "$RUNNER_TEMP/native-macos.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/native-macos.log"

      - name: Test macOS computer-use argument boundaries
        if: ${{ !cancelled() && matrix.platform == 'macos' }}
        run: |
          set -o pipefail
          xcrun swiftc -swift-version 5 -O -target arm64-apple-macosx15.0 \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            ../computer-use/macos/Errors.swift ../computer-use/macos/ComputerUseArguments.swift \
            ../../../../../scripts/release/tests/macos-computer-use-arguments.swift \
            -o "$RUNNER_TEMP/native-cua-arguments" 2>&1 | tee "$RUNNER_TEMP/native-cua-arguments.log"
          "$RUNNER_TEMP/native-cua-arguments" | tee -a "$RUNNER_TEMP/native-cua-arguments.log"

      - name: Test iOS external workspace grant lifetimes and persistence
        if: ${{ !cancelled() && matrix.platform == 'macos' }}
        run: |
          set -o pipefail
          xcrun swiftc -swift-version 5 -O \
            "$GITHUB_WORKSPACE/crates/mobile-execution/ios/Sources/MobileExecutionError.swift" \
            "$GITHUB_WORKSPACE/crates/mobile-execution/ios/Sources/WorkspaceAccessLease.swift" \
            "$GITHUB_WORKSPACE/crates/mobile-execution/ios/Sources/ExternalWorkspaceStore.swift" \
            "$GITHUB_WORKSPACE/scripts/release/tests/ios-external-workspaces.swift" \
            -o "$RUNNER_TEMP/native-workspace-grants" 2>&1 | tee "$RUNNER_TEMP/native-workspace-grants.log"
          "$RUNNER_TEMP/native-workspace-grants" | tee -a "$RUNNER_TEMP/native-workspace-grants.log"

      - name: Compile packaged macOS application UI tests
        if: ${{ !cancelled() && matrix.platform == 'macos' }}
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          export XGENT_MACOS_SMOKE_APP="$RUNNER_TEMP/Xgent.app"
          smoke_project="$RUNNER_TEMP/xgent-macos-ui-smoke"
          mkdir -p "$smoke_project"
          cp -R "$GITHUB_WORKSPACE/scripts/release/macos-ui-smoke/." "$smoke_project/"
          xcodegen generate --spec "$smoke_project/project.yml" --project "$smoke_project"
          xcodebuild build-for-testing -project "$smoke_project/XgentMacOSSmoke.xcodeproj" \
            -scheme XgentMacOSSmoke -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/native-macos-smoke-harness.log"

      - name: Compile packaged iOS application UI tests
        if: ${{ !cancelled() && matrix.platform == 'macos' }}
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          smoke_project="$RUNNER_TEMP/xgent-ios-ui-smoke"
          mkdir -p "$smoke_project"
          cp -R "$GITHUB_WORKSPACE/scripts/release/ios-ui-smoke/." "$smoke_project/"
          xcodegen generate --spec "$smoke_project/project.yml" --project "$smoke_project"
          xcodebuild build-for-testing -project "$smoke_project/XgentIOSSmoke.xcodeproj" \
            -scheme XgentIOSSmoke -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/native-ios-smoke-harness.log"

      - name: Select iPhone simulator
        if: ${{ matrix.platform == 'ios' }}
        run: |
          simulator_id="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          iphones = [d for runtime, items in devices.items() if "iOS-26" in runtime for d in items if d["name"].startswith("iPhone")]
          if not iphones:
              sys.exit("No available iOS 26 iPhone simulator")
          print(iphones[0]["udid"])
          ')"
          echo "NATIVE_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Prepare the iOS application test host
        if: ${{ matrix.platform == 'ios' }}
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          xcodegen generate --spec TestHost/project.yml --project TestHost

      - name: Test hosted iOS package and capture native layouts
        if: ${{ matrix.platform == 'ios' }}
        run: |
          set -o pipefail
          xcodebuild test -project TestHost/XgentNativeTestHost.xcodeproj \
            -scheme XgentNativeHostedTests -skipPackagePluginValidation \
            -destination "platform=iOS Simulator,id=$NATIVE_SIMULATOR_ID" \
            -resultBundlePath "$RUNNER_TEMP/native-ios.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/native-ios.log"

      - name: Compile device static archive through the production SwiftPM command
        if: ${{ matrix.platform == 'device' }}
        run: |
          set -o pipefail
          xcrun swift package resolve --package-path . --scratch-path "$RUNNER_TEMP/native-device"
          python3 ../../../../../scripts/release/prepare-apple-ui-resources.py patch-math \
            "$RUNNER_TEMP/native-device/checkouts"
          xcrun swift build --package-path . --scratch-path "$RUNNER_TEMP/native-device" \
            --configuration release --product XgentNativeUI \
            --triple arm64-apple-ios26.0 --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            2>&1 | tee "$RUNNER_TEMP/native-device.log"
          binary_path="$(xcrun swift build --package-path . --scratch-path "$RUNNER_TEMP/native-device" \
            --configuration release --product XgentNativeUI \
            --triple arm64-apple-ios26.0 --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --show-bin-path)"
          test -s "$binary_path/libXgentNativeUI.a"
          xcrun nm -g "$binary_path/libXgentNativeUI.a" > "$RUNNER_TEMP/native-symbols.txt"
          grep -Eq ' [Tt] _xgent_native_ui_reset$' "$RUNNER_TEMP/native-symbols.txt"
          grep -Eq ' [Tt] _xgent_native_ui_update$' "$RUNNER_TEMP/native-symbols.txt"
          grep -Eq ' [Tt] _xgent_native_ui_font_families$' "$RUNNER_TEMP/native-symbols.txt"
          grep -Eq ' [Tt] _xgent_native_ui_font_families_free$' "$RUNNER_TEMP/native-symbols.txt"
          grep -E ' [Tt] _xgent_native_ui_(reset|update|font_families|font_families_free)$' "$RUNNER_TEMP/native-symbols.txt" \
            | tee "$RUNNER_TEMP/native-exports.log"
          python3 ../../../../../scripts/release/prepare-apple-ui-resources.py copy \
            "$binary_path" "$RUNNER_TEMP/native-device-resources"
          python3 ../../../../../scripts/release/prepare-apple-ui-resources.py verify-ios \
            "$RUNNER_TEMP/native-device-resources" | tee "$RUNNER_TEMP/native-device-resources.log"

      - name: Export native screenshots
        if: ${{ always() }}
        run: |
          if [ -d "$RUNNER_TEMP/native-macos.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/native-macos.xcresult" \
              --output-path "$RUNNER_TEMP/native-desktop-screenshots"
          fi
          if [ -d "$RUNNER_TEMP/native-ios.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/native-ios.xcresult" \
              --output-path "$RUNNER_TEMP/native-screenshots"
          fi

      - name: Upload native verification and dependency lock
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: native-ui-verification-${{ matrix.platform }}
          path: |
            crates/fronted/src-tauri/native/apple-ui/Package.resolved
            ${{ runner.temp }}/native-*.log
            ${{ runner.temp }}/native-symbols.txt
            ${{ runner.temp }}/native-computer-use-symbols.txt
            ${{ runner.temp }}/native-screenshots
            ${{ runner.temp }}/native-desktop-screenshots
          retention-days: 3
          if-no-files-found: error
