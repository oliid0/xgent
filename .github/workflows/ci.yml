name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.19.0

jobs:
  workflows:
    name: Workflow Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache: false

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate GitHub Actions workflows
        run: actionlint

  frontend:
    name: Unified Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10.32.1

      - name: Install dependencies
        working-directory: crates/fronted
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build Web frontend
        working-directory: crates/fronted
        run: pnpm build:web

      - name: Lint unified frontend
        working-directory: crates/fronted
        run: pnpm lint

      - name: Test frontend modules
        working-directory: crates/fronted
        run: pnpm test:frontend

      - name: Test release scripts
        working-directory: crates/fronted
        run: pnpm test:release

  tauri-rust:
    name: Tauri Rust Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/fronted/src-tauri

      - name: Check Tauri backend tests
        env:
          CARGO_TERM_COLOR: always
        run: cargo check --manifest-path crates/fronted/src-tauri/Cargo.toml --tests

      # Local toolchains are intentionally not required for this repository.
      # Upload Cargo's resolved lockfile so dependency changes discovered by
      # the Linux runner can be reviewed and committed from the Actions result.
      - name: Upload resolved Cargo lockfile
        if: ${{ always() && hashFiles('Cargo.lock') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: resolved-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1

      - name: Test Tauri history migrations
        env:
          CARGO_TERM_COLOR: always
        run: cargo test --manifest-path crates/fronted/src-tauri/Cargo.toml chat_history --lib

  architecture:
    name: Architecture Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check single-frontend boundaries
        run: node scripts/check-architecture.mjs

  whitespace:
    name: Diff Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: git diff --check
