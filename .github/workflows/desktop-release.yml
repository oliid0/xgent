name: Xgent Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Version used for package names, for example v0.1.0
        required: true
      publish:
        description: Publish the packages as a GitHub Release
        required: false
        type: boolean
        default: false
      sign:
        description: Apple-sign/notarize macOS and sign Tauri updater artifacts (requires release settings)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: 22.19.0

jobs:
  release-metadata:
    name: Release Metadata
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_sha: ${{ steps.source.outputs.release_sha }}
      publish_release: ${{ steps.mode.outputs.publish_release }}
      signed_release: ${{ steps.mode.outputs.signed_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/release/prepare-app-version-from-tag.mjs "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT" --json

      - name: Resolve release mode
        id: mode
        env:
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish }}
          SIGNED_RELEASE: ${{ inputs.sign || (github.event_name == 'push' && vars.RELEASE_SIGNED == 'true') }}
        run: |
          echo "publish_release=$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"
          echo "signed_release=$SIGNED_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Resolve immutable release source
        id: source
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            release_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          else
            release_sha="$(git rev-parse HEAD)"
          fi
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  release-preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    needs: release-metadata
    env:
      SIGNED_RELEASE: ${{ needs.release-metadata.outputs.signed_release }}
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ vars.APPLE_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - name: Explain package-only mode
        if: env.SIGNED_RELEASE != 'true'
        run: echo "Unsigned mode uses ad-hoc macOS signing and requires no release settings."

      - name: Validate release secrets
        if: env.SIGNED_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APPLE_CERTIFICATE_P12_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_TEAM_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_UPDATER_PUBLIC_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing release setting::$name is required for signed publishing. Add it under Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          test "$missing" -eq 0

  macos:
    name: macOS ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs:
      - release-metadata
      - release-preflight
    env:
      XGENT_APP_VERSION: ${{ needs.release-metadata.outputs.app_version }}
      XGENT_IS_PRERELEASE: ${{ needs.release-metadata.outputs.is_prerelease }}
      XGENT_RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
      SIGNED_RELEASE: ${{ needs.release-metadata.outputs.signed_release }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            suffix: x64
          - name: Apple Silicon
            runner: macos-14
            target: aarch64-apple-darwin
            suffix: aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-metadata.outputs.release_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prepare release version config
        working-directory: crates/fronted
        run: node ../../scripts/release/prepare-app-version-from-tag.mjs "$XGENT_RELEASE_TAG" --github-env "$GITHUB_ENV" --tauri-config src-tauri/tauri.version.generated.conf.json

      - name: Install pnpm
        run: npm install -g pnpm@10.32.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/fronted/src-tauri

      - name: Install frontend dependencies
        working-directory: crates/fronted
        run: pnpm install --frozen-lockfile

      - name: Import Apple signing certificate
        if: env.SIGNED_RELEASE == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE_P12_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/xgent-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/developer-id-application.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          identity_count="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -c '"Developer ID Application:' || true)"
          if [ "$identity_count" -ne 1 ]; then
            echo "::error title=Invalid Apple certificate::Expected exactly one Developer ID Application identity in the imported .p12, found $identity_count."
            exit 1
          fi
          signing_identity="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep '"Developer ID Application:' | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Store notarization profile
        if: env.SIGNED_RELEASE == 'true'
        env:
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          xcrun notarytool store-credentials xgent-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --validate

      - name: Build signed and notarized DMG
        if: env.SIGNED_RELEASE == 'true'
        env:
          DESKTOP_MACOS_TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          XGENT_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          XGENT_UPDATE_REPOSITORY: ${{ github.repository }}
        run: make desktop-build-macos-release

      - name: Build unsigned macOS packages
        if: env.SIGNED_RELEASE != 'true'
        working-directory: crates/fronted
        env:
          APPLE_SIGNING_IDENTITY: "-"
          DESKTOP_MACOS_TARGET: ${{ matrix.target }}
        run: pnpm tauri build --config src-tauri/tauri.macos.conf.json --config "$XGENT_TAURI_VERSION_CONFIG" --target "$DESKTOP_MACOS_TARGET"

      - name: Stage macOS artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          dmg_path="$(find "target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name 'Xgent_*.dmg' -print -quit)"
          updater_path="$(find "target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          test -n "$dmg_path"
          cp "$dmg_path" "dist/Xgent-${XGENT_RELEASE_TAG}-macOS-${{ matrix.suffix }}.dmg"
          if [ "$SIGNED_RELEASE" = true ]; then
            test -n "$updater_path"
            test -f "$updater_path.sig"
            cp "$updater_path" "dist/Xgent-${XGENT_RELEASE_TAG}-macOS-${{ matrix.suffix }}.app.tar.gz"
            cp "$updater_path.sig" "dist/Xgent-${XGENT_RELEASE_TAG}-macOS-${{ matrix.suffix }}.app.tar.gz.sig"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: xgent-macos-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    needs:
      - release-metadata
      - release-preflight
    env:
      XGENT_APP_VERSION: ${{ needs.release-metadata.outputs.app_version }}
      XGENT_IS_PRERELEASE: ${{ needs.release-metadata.outputs.is_prerelease }}
      XGENT_RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
      SIGNED_RELEASE: ${{ needs.release-metadata.outputs.signed_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-metadata.outputs.release_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prepare release version config
        shell: bash
        working-directory: crates/fronted
        run: node ../../scripts/release/prepare-app-version-from-tag.mjs "$XGENT_RELEASE_TAG" --github-env "$GITHUB_ENV" --tauri-config src-tauri/tauri.version.generated.conf.json --tauri-platform windows

      - name: Install pnpm
        run: npm install -g pnpm@10.32.1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/fronted/src-tauri

      - name: Install frontend dependencies
        working-directory: crates/fronted
        run: pnpm install --frozen-lockfile

      - name: Build Windows bundles
        if: env.SIGNED_RELEASE == 'true'
        working-directory: crates/fronted
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          XGENT_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          XGENT_UPDATE_REPOSITORY: ${{ github.repository }}
        run: pnpm tauri build --config src-tauri/tauri.windows.release.conf.json --config "$XGENT_TAURI_VERSION_CONFIG" --target x86_64-pc-windows-msvc

      - name: Build unsigned Windows packages
        if: env.SIGNED_RELEASE != 'true'
        working-directory: crates/fronted
        shell: bash
        run: pnpm tauri build --config src-tauri/tauri.windows.conf.json --config "$XGENT_TAURI_VERSION_CONFIG" --target x86_64-pc-windows-msvc

      - name: Stage Windows artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          msi_path="$(find target crates/fronted/src-tauri/target -type f -name '*.msi' -path '*bundle*' -print -quit 2>/dev/null || true)"
          exe_path="$(find target crates/fronted/src-tauri/target -type f -name '*.exe' -path '*bundle*' -print -quit 2>/dev/null || true)"
          portable_exe_path="$(find target crates/fronted/src-tauri/target -type f -name 'xgent.exe' -path '*/release/*' ! -path '*bundle*' -print -quit 2>/dev/null || true)"
          test -n "$msi_path"
          test -n "$exe_path"
          test -n "$portable_exe_path"
          cp "$msi_path" "dist/Xgent-${XGENT_RELEASE_TAG}-Windows-x64.msi"
          cp "$exe_path" "dist/Xgent-${XGENT_RELEASE_TAG}-Windows-x64-Setup.exe"
          if [ "$SIGNED_RELEASE" = true ]; then
            test -f "$msi_path.sig"
            test -f "$exe_path.sig"
            cp "$msi_path.sig" "dist/Xgent-${XGENT_RELEASE_TAG}-Windows-x64.msi.sig"
            cp "$exe_path.sig" "dist/Xgent-${XGENT_RELEASE_TAG}-Windows-x64-Setup.exe.sig"
          fi
          mkdir -p dist/portable/Xgent
          cp "$portable_exe_path" dist/portable/Xgent/Xgent.exe
          portable_zip="dist/Xgent-${XGENT_RELEASE_TAG}-Windows-x64-portable.zip"
          powershell -NoProfile -Command "Compress-Archive -Path 'dist/portable/Xgent/*' -DestinationPath '$portable_zip' -Force"
          powershell -NoProfile -File scripts/release/smoke-launch-windows.ps1 -ExecutablePath dist/portable/Xgent/Xgent.exe
          rm -rf dist/portable
          test "$(find dist -type f | wc -l)" -gt 0

      - uses: actions/upload-artifact@v7
        with:
          name: xgent-windows-x64
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    needs:
      - release-metadata
      - release-preflight
    env:
      XGENT_APP_VERSION: ${{ needs.release-metadata.outputs.app_version }}
      XGENT_IS_PRERELEASE: ${{ needs.release-metadata.outputs.is_prerelease }}
      XGENT_RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
      SIGNED_RELEASE: ${{ needs.release-metadata.outputs.signed_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-metadata.outputs.release_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prepare release version config
        working-directory: crates/fronted
        run: node ../../scripts/release/prepare-app-version-from-tag.mjs "$XGENT_RELEASE_TAG" --github-env "$GITHUB_ENV" --tauri-config src-tauri/tauri.version.generated.conf.json

      - name: Install pnpm
        run: npm install -g pnpm@10.32.1

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/fronted/src-tauri

      - name: Install frontend dependencies
        working-directory: crates/fronted
        run: pnpm install --frozen-lockfile

      - name: Build Linux bundles
        if: env.SIGNED_RELEASE == 'true'
        working-directory: crates/fronted
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          XGENT_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          XGENT_UPDATE_REPOSITORY: ${{ github.repository }}
        run: pnpm tauri build --config src-tauri/tauri.linux.release.conf.json --config "$XGENT_TAURI_VERSION_CONFIG" --target x86_64-unknown-linux-gnu --bundles appimage deb rpm

      - name: Build unsigned Linux packages
        if: env.SIGNED_RELEASE != 'true'
        working-directory: crates/fronted
        run: pnpm tauri build --config "$XGENT_TAURI_VERSION_CONFIG" --target x86_64-unknown-linux-gnu --bundles appimage deb rpm

      - name: Strip bundled Wayland libraries
        run: |
          set -euo pipefail
          appimage_path="$(find crates/fronted/src-tauri/target target -type f -name '*.AppImage' -path '*bundle*' -print -quit 2>/dev/null || true)"
          test -n "$appimage_path"
          bash scripts/release/postprocess-linux-appimage.sh "$(realpath "$appimage_path")"

      - name: Re-sign AppImage
        if: env.SIGNED_RELEASE == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          appimage_path="$(find crates/fronted/src-tauri/target target -type f -name '*.AppImage' -path '*bundle*' -print -quit 2>/dev/null || true)"
          test -n "$appimage_path"
          appimage_path="$(realpath "$appimage_path")"
          test ! -e "$appimage_path.sig"
          pnpm --dir crates/fronted tauri signer sign "$appimage_path"
          test -s "$appimage_path.sig"

      - name: Stage Linux artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          appimage_path="$(find crates/fronted/src-tauri/target target -type f -name '*.AppImage' -path '*bundle*' -print -quit 2>/dev/null || true)"
          deb_path="$(find crates/fronted/src-tauri/target target -type f -name '*.deb' -path '*bundle*' -print -quit 2>/dev/null || true)"
          rpm_path="$(find crates/fronted/src-tauri/target target -type f -name '*.rpm' -path '*bundle*' -print -quit 2>/dev/null || true)"
          test -n "$appimage_path"
          test -n "$deb_path"
          test -n "$rpm_path"
          cp "$appimage_path" "dist/Xgent-${XGENT_RELEASE_TAG}-Linux-x86_64.AppImage"
          cp "$deb_path" "dist/Xgent-${XGENT_RELEASE_TAG}-Linux-x86_64.deb"
          cp "$rpm_path" "dist/Xgent-${XGENT_RELEASE_TAG}-Linux-x86_64.rpm"
          if [ "$SIGNED_RELEASE" = true ]; then
            test -f "$appimage_path.sig"
            test -f "$deb_path.sig"
            test -f "$rpm_path.sig"
            cp "$appimage_path.sig" "dist/Xgent-${XGENT_RELEASE_TAG}-Linux-x86_64.AppImage.sig"
            cp "$deb_path.sig" "dist/Xgent-${XGENT_RELEASE_TAG}-Linux-x86_64.deb.sig"
            cp "$rpm_path.sig" "dist/Xgent-${XGENT_RELEASE_TAG}-Linux-x86_64.rpm.sig"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: xgent-linux-x64
          path: dist/*
          if-no-files-found: error

  android:
    name: Android universal APK
    runs-on: ubuntu-latest
    needs:
      - release-metadata
      - release-preflight
    env:
      XGENT_APP_VERSION: ${{ needs.release-metadata.outputs.app_version }}
      XGENT_RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_NDK_VERSION: 28.2.13676358
      ANDROID_BUILD_TOOLS_VERSION: 36.0.0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-metadata.outputs.release_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and native build tools
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-36" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION" \
            "ndk;$ANDROID_NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install host archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils zstd

      - name: Install pnpm
        run: npm install -g pnpm@10.32.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/fronted/src-tauri
          shared-key: android

      - name: Install frontend dependencies
        working-directory: crates/fronted
        run: pnpm install --frozen-lockfile

      - name: Prepare release version config
        working-directory: crates/fronted
        run: node ../../scripts/release/prepare-app-version-from-tag.mjs "$XGENT_RELEASE_TAG" --github-env "$GITHUB_ENV" --tauri-config src-tauri/tauri.version.generated.conf.json

      - name: Prepare verified Android execution environment
        run: |
          set -euo pipefail
          bash scripts/mobile/prepare-proot-android.sh
          bash scripts/mobile/prepare-alpine-rootfs-android.sh
          bash scripts/mobile/prepare-mobile-legal-notices.sh
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          import re

          with open("crates/mobile-execution/android/src/main/assets/xgent-proot-manifest.json", encoding="utf-8") as stream:
              manifest = json.load(stream)
          version = str(manifest["version"])
          upstream_version = version.split(":", 1)[-1].split("-", 1)[0]
          source_ref = str(manifest.get("commit") or f"v{upstream_version}")
          safe_label = re.sub(r"[^A-Za-z0-9._-]+", "-", version)
          print(f"PROOT_SOURCE_REF={source_ref}")
          print(f"PROOT_VERSION_LABEL={safe_label}")
          PY

      - name: Initialize Tauri Android project
        working-directory: crates/fronted
        run: pnpm tauri android init --ci

      - name: Apply and verify Xgent Android project resources
        working-directory: crates/fronted
        run: node ../../scripts/mobile/apply-android-project-overrides.mjs src-tauri

      - name: Build unsigned release APK
        working-directory: crates/fronted
        run: pnpm tauri android build --ci --apk --target aarch64 --target x86_64 --config "$XGENT_TAURI_VERSION_CONFIG"

      - name: Sign and verify installable APK
        run: |
          set -euo pipefail
          mapfile -t apk_candidates < <(
            find crates/fronted/src-tauri/gen/android/app/build/outputs/apk \
              -type f -name '*.apk' -print
          )
          if [ "${#apk_candidates[@]}" -ne 1 ]; then
            printf 'Expected one universal APK, found %s\n' "${#apk_candidates[@]}" >&2
            printf '%s\n' "${apk_candidates[@]}" >&2
            exit 1
          fi

          credential_count=0
          for value in \
            "$ANDROID_KEYSTORE_BASE64" \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_PASSWORD"; do
            if [ -n "$value" ]; then credential_count=$((credential_count + 1)); fi
          done

          keystore_path="$RUNNER_TEMP/xgent-android-release.jks"
          if [ "$credential_count" -eq 4 ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
            signing_mode="repository release key"
            effective_alias="$ANDROID_KEY_ALIAS"
            effective_store_password="$ANDROID_KEYSTORE_PASSWORD"
            effective_key_password="$ANDROID_KEY_PASSWORD"
          elif [ "$credential_count" -eq 0 ]; then
            signing_mode="ephemeral CI key (installable, but not update-stable)"
            effective_alias="xgent-ci"
            effective_store_password="xgent-ci-release"
            effective_key_password="xgent-ci-release"
            keytool -genkeypair -noprompt \
              -keystore "$keystore_path" \
              -storetype PKCS12 \
              -storepass "$effective_store_password" \
              -keypass "$effective_key_password" \
              -alias "$effective_alias" \
              -keyalg RSA \
              -keysize 3072 \
              -validity 3650 \
              -dname "CN=Xgent CI, OU=Release, O=Xgent, C=US"
          else
            echo "Android signing secrets are partially configured; set all four or none." >&2
            exit 1
          fi

          build_tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          mkdir -p dist
          aligned_apk="$RUNNER_TEMP/xgent-aligned.apk"
          release_apk="dist/Xgent-${XGENT_RELEASE_TAG}-Android-universal.apk"
          # Android 15+ devices can use a 16 KiB memory page size. Build-tools
          # 35+ require -P 16 in addition to the normal 4-byte APK alignment
          # for uncompressed native libraries.
          "$build_tools/zipalign" -P 16 -f 4 "${apk_candidates[0]}" "$aligned_apk"
          EFFECTIVE_STORE_PASSWORD="$effective_store_password" \
          EFFECTIVE_KEY_PASSWORD="$effective_key_password" \
            "$build_tools/apksigner" sign \
              --ks "$keystore_path" \
              --ks-key-alias "$effective_alias" \
              --ks-pass env:EFFECTIVE_STORE_PASSWORD \
              --key-pass env:EFFECTIVE_KEY_PASSWORD \
              --out "$release_apk" \
              "$aligned_apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$release_apk" \
            | tee dist/Android-signing.txt
          "$build_tools/zipalign" -c -P 16 4 "$release_apk"
          printf '\nSigning mode: %s\n' "$signing_mode" >> dist/Android-signing.txt
          unzip -l "$release_apk" | grep -F 'lib/arm64-v8a/libxgent_proot.so'
          unzip -l "$release_apk" | grep -F 'lib/x86_64/libxgent_proot.so'
          unzip -l "$release_apk" | grep -F 'lib/arm64-v8a/libxgent_proot_loader.so'
          unzip -l "$release_apk" | grep -F 'lib/x86_64/libxgent_proot_loader.so'
          unzip -l "$release_apk" | grep -F 'assets/xgent-proot-manifest.json'
          unzip -l "$release_apk" | grep -F 'assets/mobile-execution/rootfs/manifest.json'
          unzip -l "$release_apk" | grep -F 'assets/mobile-execution/rootfs/alpine-3.22.5-arm64-v8a.tar.gzip'
          unzip -l "$release_apk" | grep -F 'assets/mobile-execution/rootfs/alpine-3.22.5-x86_64.tar.gzip'
          python3 - "$release_apk" <<'PY'
          import hashlib
          import json
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = set(archive.namelist())
              proot = json.loads(archive.read("assets/xgent-proot-manifest.json"))
              if proot.get("source") == "termux-official-packages":
                  for abi in ("arm64-v8a", "x86_64"):
                      for library in ("libtalloc.so", "libandroid-shmem.so"):
                          path = f"lib/{abi}/{library}"
                          if path not in names:
                              raise SystemExit(f"Missing official PRoot dependency: {path}")
              root = "assets/mobile-execution/rootfs/"
              manifest = json.loads(archive.read(root + "manifest.json"))
              if manifest.get("schemaVersion") != 1:
                  raise SystemExit("Unexpected Android rootfs manifest schema")
              if len(manifest.get("archives", {})) != 2:
                  raise SystemExit("Android rootfs manifest must contain exactly two ABIs")
              for abi, record in manifest["archives"].items():
                  if not record["file"].endswith(".tar.gzip"):
                      raise SystemExit(
                          f"Rootfs asset for {abi} uses an AAPT-transformable filename: {record['file']}"
                      )
                  payload = archive.read(root + record["file"])
                  if not payload.startswith(b"\x1f\x8b"):
                      raise SystemExit(f"Rootfs asset for {abi} is no longer gzip data")
                  actual = hashlib.sha256(payload).hexdigest()
                  if actual != record["sha256"]:
                      raise SystemExit(
                          f"Rootfs SHA-256 mismatch inside APK for {abi}: {actual}"
                      )
          PY

          native_check_dir="$RUNNER_TEMP/xgent-native-libraries"
          mkdir -p "$native_check_dir"
          unzip -q "$release_apk" 'lib/*/*.so' -d "$native_check_dir"
          readelf="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$readelf"
          alignment_failed=0
          while IFS= read -r native_library; do
            while IFS= read -r alignment; do
              if [ "$((alignment))" -lt 16384 ]; then
                echo "::error title=Android 16 KiB alignment::$native_library has LOAD alignment $alignment"
                alignment_failed=1
              fi
            done < <("$readelf" -lW "$native_library" | awk '$1 == "LOAD" { print $NF }')
          done < <(find "$native_check_dir/lib" -type f -name '*.so' -print)
          test "$alignment_failed" -eq 0

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke launch signed Android APK
        uses: reactivecircus/android-emulator-runner@ed009f5318f15b1cf93a191b856c4f1748a2d4c1 # v2, pinned 2026-08-26
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            release_apk="dist/Xgent-${XGENT_RELEASE_TAG}-Android-universal.apk"
            adb logcat -c
            adb install -r "$release_apk"
            adb shell monkey -p com.ohi.xgent -c android.intent.category.LAUNCHER 1
            sleep 12
            app_pid="$(adb shell pidof com.ohi.xgent | tr -d '\r')"
            test -n "$app_pid"
            adb shell dumpsys window windows | grep -F 'com.ohi.xgent'
            adb exec-out screencap -p > "$RUNNER_TEMP/xgent-android-smoke.png"
            test "$(wc -c < "$RUNNER_TEMP/xgent-android-smoke.png")" -gt 10000
            if adb logcat -d AndroidRuntime:E '*:S' \
              | grep -E -A 12 'Process: com\.ohi\.xgent'; then
              echo "Xgent emitted an Android fatal exception during launch" >&2
              exit 1
            fi

      - name: Upload Android launch evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xgent-android-launch-evidence
          path: ${{ runner.temp }}/xgent-android-smoke.png
          if-no-files-found: warn
          retention-days: 7

      - name: Package PRoot corresponding source
        run: |
          set -euo pipefail
          source_archive="dist/Xgent-${XGENT_RELEASE_TAG}-PRoot-${PROOT_VERSION_LABEL}-source.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://codeload.github.com/termux/proot/tar.gz/$PROOT_SOURCE_REF" \
            --output "$source_archive"
          test -s "$source_archive"
          source_name="$(basename "$source_archive")"
          (cd dist && sha256sum "$source_name" > "${source_name}.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: xgent-android
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS arm64 unsigned IPA
    runs-on: macos-15
    needs:
      - release-metadata
      - release-preflight
    env:
      XGENT_APP_VERSION: ${{ needs.release-metadata.outputs.app_version }}
      XGENT_RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-metadata.outputs.release_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10.32.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/fronted/src-tauri
          shared-key: ios

      - name: Install frontend dependencies
        working-directory: crates/fronted
        run: pnpm install --frozen-lockfile

      - name: Prepare release version config
        working-directory: crates/fronted
        run: node ../../scripts/release/prepare-app-version-from-tag.mjs "$XGENT_RELEASE_TAG" --github-env "$GITHUB_ENV" --tauri-config src-tauri/tauri.version.generated.conf.json

      - name: Prepare verified iOS shell resources
        run: |
          set -euo pipefail
          bash scripts/mobile/prepare-ios-shell-resources.sh
          bash scripts/mobile/prepare-mobile-legal-notices.sh
          test -s crates/mobile-execution/ios-frameworks/Frameworks/python3_ios.xcframework/Info.plist
          test -s crates/mobile-execution/ios/Sources/Resources/python/lib/python3.9/os.py
          test -s crates/mobile-execution/ios/Sources/Resources/python/lib/python3.9/ssl.py
          test -s crates/mobile-execution/ios/Sources/Resources/bin/pkg
          test -s crates/mobile-execution/ios/Sources/Resources/vim/syntax/syntax.vim
          test -s crates/mobile-execution/ios/Sources/Resources/cacert.pem
          test -s crates/mobile-execution/ios/Sources/Resources/commandDictionary.plist
          test -s crates/mobile-execution/ios/Sources/Resources/extraCommandsDictionary.plist

      - name: Install Tauri iOS host dependencies
        shell: bash
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          for formula in xcodegen libimobiledevice cocoapods; do
            if ! brew list --versions "$formula" >/dev/null 2>&1; then
              brew install "$formula"
            fi
          done
          brew link --overwrite --force xcodegen libimobiledevice cocoapods
          brew_prefix="$(brew --prefix)"
          export PATH="$brew_prefix/bin:$PATH"
          echo "$brew_prefix/bin" >> "$GITHUB_PATH"
          hash -r
          command -v xcodegen
          command -v idevicesyslog
          command -v pod
          xcodegen --version
          pod --version
          xcode-select -p
          xcodebuild -version

      - name: Initialize Tauri iOS project
        working-directory: crates/fronted
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/ios-init.log"
          if ! pnpm tauri ios init --ci 2>&1 | tee "$log"; then
            message="$(tail -n 80 "$log")"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error file=crates/fronted/src-tauri/ios.project.yml,line=1,title=iOS project initialization failed::$message"
            exit 1
          fi

      - name: Build unsigned iOS IPA
        working-directory: crates/fronted
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/ios-build.log"
          if ! pnpm tauri ios build --ci --no-sign --target aarch64 --build-number "${{ github.run_number }}" --config "$XGENT_TAURI_VERSION_CONFIG" 2>&1 | tee "$log"; then
            message="$(tail -n 240 "$log")"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error file=crates/fronted/src-tauri/tauri.ios.conf.json,line=1,title=iOS IPA build failed::$message"
            exit 1
          fi

      - name: Stage and inspect IPA
        run: |
          set -euo pipefail
          ipa_candidates=()
          while IFS= read -r -d '' candidate; do
            ipa_candidates+=("$candidate")
          done < <(find crates/fronted/src-tauri/gen/apple -type f -name '*.ipa' -print0)
          if [ "${#ipa_candidates[@]}" -ne 1 ]; then
            printf 'Expected one IPA, found %s\n' "${#ipa_candidates[@]}" >&2
            printf '%s\n' "${ipa_candidates[@]}" >&2
            exit 1
          fi
          mkdir -p dist
          release_ipa="dist/Xgent-${XGENT_RELEASE_TAG}-iOS-arm64-unsigned.ipa"
          cp "${ipa_candidates[0]}" "$release_ipa"
          unzip -t "$release_ipa"
          python3 - "$release_ipa" <<'PY'
          import plistlib
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = set(archive.namelist())
              app_roots = {
                  name.split("/", 2)[1]
                  for name in names
                  if name.startswith("Payload/") and ".app/" in name
              }
              if len(app_roots) != 1:
                  raise SystemExit(f"Expected exactly one iOS app bundle, found {sorted(app_roots)}")
              app = f"Payload/{app_roots.pop()}/"
              info_path = app + "Info.plist"
              if info_path not in names:
                  raise SystemExit("The iOS app bundle is missing Info.plist")
              info = plistlib.loads(archive.read(info_path))
              executable = info.get("CFBundleExecutable")
              if not executable or app + executable not in names:
                  raise SystemExit("The iOS app bundle is missing its declared executable")

              required = [
                  "Frameworks/ios_system.framework/ios_system",
                  "Frameworks/ffmpeg.framework/ffmpeg",
                  "Frameworks/python3_ios.framework/python3_ios",
                  "Frameworks/python3_ios-_ssl.framework/python3_ios-_ssl",
                  "Frameworks/python3_ios-_sqlite3.framework/python3_ios-_sqlite3",
                  "mobile-execution/commandDictionary.plist",
                  "mobile-execution/extraCommandsDictionary.plist",
                  "mobile-execution/python/lib/python3.9/os.py",
                  "mobile-execution/python/lib/python3.9/ssl.py",
                  "mobile-execution/bin/pkg",
                  "mobile-execution/vim/syntax/syntax.vim",
                  "mobile-execution/cacert.pem",
              ]
              missing = [relative for relative in required if app + relative not in names]
              if missing:
                  raise SystemExit("Missing required iOS app resources: " + ", ".join(missing))
              empty = [
                  relative
                  for relative in required
                  if archive.getinfo(app + relative).file_size == 0
              ]
              if empty:
                  raise SystemExit("Empty required iOS app resources: " + ", ".join(empty))
          PY
          printf '%s\n' \
            'This IPA is intentionally unsigned. Re-sign it with an Apple Developer identity or a compatible sideloading service before installation.' \
            > dist/iOS-signing.txt

      - name: Build iOS simulator smoke target
        working-directory: crates/fronted
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/ios-simulator-build.log"
          if ! pnpm tauri ios build --ci --no-sign --target aarch64-sim --build-number "${{ github.run_number }}" --config "$XGENT_TAURI_VERSION_CONFIG" 2>&1 | tee "$log"; then
            message="$(tail -n 160 "$log")"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error file=crates/fronted/src-tauri/tauri.ios.conf.json,line=1,title=iOS simulator build failed::$message"
            exit 1
          fi

      - name: Smoke launch iOS simulator app
        shell: bash
        run: |
          set -euo pipefail
          sim_app="$(python3 - <<'PY'
          import os
          import plistlib

          candidates = []
          for root, directories, files in os.walk("crates/fronted/src-tauri"):
              if root.endswith(".xcarchive"):
                  directories.clear()
                  continue
              for directory in list(directories):
                  if not directory.endswith(".app"):
                      continue
                  path = os.path.join(root, directory)
                  info_path = os.path.join(path, "Info.plist")
                  try:
                      with open(info_path, "rb") as stream:
                          info = plistlib.load(stream)
                  except (FileNotFoundError, plistlib.InvalidFileException):
                      continue
                  platforms = info.get("CFBundleSupportedPlatforms", [])
                  if "iPhoneSimulator" in platforms:
                      candidates.append((os.path.getmtime(info_path), path))
          if not candidates:
              raise SystemExit("No iPhoneSimulator .app bundle was produced")
          print(max(candidates)[1])
          PY
          )"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$sim_app/Info.plist")"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$sim_app/Info.plist")"
          test -x "$sim_app/$executable"
          simulator_udid="$(python3 - <<'PY'
          import json
          import subprocess

          payload = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "--json"],
                  text=True,
              )
          )
          runtimes = sorted(
              (runtime for runtime in payload["devices"] if ".iOS-" in runtime),
              reverse=True,
          )
          for runtime in runtimes:
              for device in payload["devices"][runtime]:
                  if device.get("isAvailable") and "iPhone" in device.get("name", ""):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator was found")
          PY
          )"
          trap 'xcrun simctl shutdown "$simulator_udid" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$simulator_udid" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$simulator_udid" -b
          xcrun simctl install "$simulator_udid" "$sim_app"
          launch_result="$(xcrun simctl launch --terminate-running-process "$simulator_udid" "$bundle_id")"
          app_pid="${launch_result##*: }"
          case "$app_pid" in
            ''|*[!0-9]*) echo "Could not parse simulator launch PID: $launch_result" >&2; exit 1 ;;
          esac
          sleep 12
          xcrun simctl spawn "$simulator_udid" ps -p "$app_pid"
          xcrun simctl io "$simulator_udid" screenshot "$RUNNER_TEMP/xgent-ios-smoke.png"
          test "$(wc -c < "$RUNNER_TEMP/xgent-ios-smoke.png")" -gt 10000

      - name: Upload iOS launch evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xgent-ios-launch-evidence
          path: ${{ runner.temp }}/xgent-ios-smoke.png
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: xgent-ios
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: ${{ needs.release-metadata.outputs.publish_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - release-metadata
      - macos
      - windows
      - linux
      - android
      - ios
    env:
      XGENT_APP_VERSION: ${{ needs.release-metadata.outputs.app_version }}
      XGENT_IS_PRERELEASE: ${{ needs.release-metadata.outputs.is_prerelease }}
      XGENT_RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
      SIGNED_RELEASE: ${{ needs.release-metadata.outputs.signed_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-metadata.outputs.release_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.release-metadata.outputs.release_sha }}
          PACKYCODE_API_KEY: ${{ secrets.PACKYCODE_API_KEY }}
          AI_RELEASE_NOTES_API_KEY: ${{ secrets.AI_RELEASE_NOTES_API_KEY }}
          AI_RELEASE_NOTES_BASE_URL: ${{ vars.AI_RELEASE_NOTES_BASE_URL }}
          AI_RELEASE_NOTES_MODEL: ${{ vars.AI_RELEASE_NOTES_MODEL }}
        run: |
          set -euo pipefail
          is_prerelease="$XGENT_IS_PRERELEASE"

          github_notes_path="$RUNNER_TEMP/xgent-github-release-notes.md"
          notes_path="$RUNNER_TEMP/xgent-release-notes.md"
          if ! gh api "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$RELEASE_SHA" \
            --jq ".body" > "$github_notes_path"; then
            printf 'Xgent %s\n' "$RELEASE_TAG" > "$github_notes_path"
          fi
          if [ ! -s "$github_notes_path" ]; then
            printf 'Xgent %s\n' "$RELEASE_TAG" > "$github_notes_path"
          fi

          node scripts/release/create-ai-release-notes.mjs "$RELEASE_TAG" "$notes_path" "$github_notes_path"
          if [ ! -s "$notes_path" ]; then
            printf 'Xgent %s\n' "$RELEASE_TAG" > "$notes_path"
          fi

          created_draft=false
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            edit_args=(--title "Xgent $RELEASE_TAG" --notes-file "$notes_path")
            if [ "$is_prerelease" = true ]; then
              edit_args+=(--prerelease)
            else
              edit_args+=(--prerelease=false --latest)
            fi
            gh release edit "$RELEASE_TAG" "${edit_args[@]}"
          else
            create_args=(--draft --target "$RELEASE_SHA" --title "Xgent $RELEASE_TAG" --notes-file "$notes_path")
            if [ "$is_prerelease" = true ]; then
              create_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${create_args[@]}"
            created_draft=true
          fi

          mapfile -t signature_assets < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name | select(endswith(".sig"))')
          for asset in "${signature_assets[@]}"; do
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes
          done

          rm -rf public-release-assets
          mkdir -p public-release-assets
          find release-artifacts -maxdepth 1 -type f ! -name '*.sig' ! -name latest.json ! -name '*-smoke.png' -exec cp {} public-release-assets/ \;

          shopt -s nullglob
          public_assets=(public-release-assets/*)
          if [ "${#public_assets[@]}" -eq 0 ]; then
            echo "No public release assets were found."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${public_assets[@]}" --clobber

          if [ "$SIGNED_RELEASE" = true ]; then
            node scripts/release/create-tauri-updater-manifest.mjs release-artifacts release-artifacts/latest.json "$notes_path"
            gh release upload "$RELEASE_TAG" release-artifacts/latest.json --clobber
          elif gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq latest.json; then
            gh release delete-asset "$RELEASE_TAG" latest.json --yes
          fi

          if [ "$created_draft" = true ]; then
            publish_args=(--draft=false --title "Xgent $RELEASE_TAG" --notes-file "$notes_path")
            if [ "$is_prerelease" = true ]; then
              publish_args+=(--prerelease)
            else
              publish_args+=(--prerelease=false --latest)
            fi
            gh release edit "$RELEASE_TAG" "${publish_args[@]}"
          fi
